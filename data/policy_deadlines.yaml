# Regulatory / programme migration deadlines (build-plan.md P22).
#
# These are NOT Z. Z (data/scenarios.yaml) is when a quantum computer is
# assumed to arrive; a policy deadline is when an authority says migration
# must be done, whether or not Z has arrived. The ledger's bands never read
# this file -- `risk/policy.py` lays these dates over a row as an annotation
# ("open / met / undetermined against India CII full migration, 2029-12-31"),
# so a band cannot move because a regulator published a date.
#
# Same citation rule as every other registry: usable rows cite a non-empty
# in-repo file (docs/sources/, vendored excerpts with the fetched PDF's
# SHA-256) and quote the sentence that states the date.
schema_version: 1

policies:
  - key: IN_DST_CII
    label: "India DST roadmap -- Critical Information Infrastructure"
    applies_to: quantum_vulnerable
    usable: true
    citation: "docs/sources/India_DST_Quantum_Safe_Roadmap_2026.md -- printed pp. 36, 105-107"
    quote: "Milestone 3: Full Migration – (CII : 31 December 2029, Enterprises: No later than 31 December 2033)"
    milestones:
      - key: testing_labs
        label: "National PQC Testing & Certification Program -- Tier-1/Tier-2 labs operational"
        # National infrastructure, not a per-row migration deadline: a CII
        # asset row cannot itself meet or miss "labs exist", so this is
        # programme scope like `foundations` below and is never laid over a
        # row. "by December 2026" carries no day of its own in the source;
        # normalized to the month's last day, same convention as the
        # year-only NIST_IR_8547_IPD dates below.
        scope: programme
        date: 2026-12-31
        quote: "Establish a National PQC Testing & Certification Program under TEC/STQC/BIS, operationalising Tier-1 and Tier-2 labs (As designated in Section 6.0) by December 2026."
      - key: foundations
        label: "Building the foundations (inventory, CBOM requests)"
        # Programme-level: inventory, CBOM requests, pilots. Not something a
        # single key meets or misses, so risk/policy.py never lays it on a row.
        scope: programme
        date: 2027-12-31
        quote: "Milestone 1: Building the Foundations - (CII: No later than 31 December 2027, Enterprises: No later than 31 December 2028)"
      - key: high_priority
        label: "High-priority systems migrated"
        date: 2028-12-31
        quote: "Milestone 2: Migration of High-Priority Systems – (CII: 31 December 2028, Enterprises: No later than 31 December 2030)"
      - key: full_migration
        label: "Full migration"
        date: 2029-12-31
        quote: "Milestone 3: Full Migration – (CII : 31 December 2029, Enterprises: No later than 31 December 2033)"

  - key: IN_DST_ENTERPRISE
    label: "India DST roadmap -- Enterprises"
    applies_to: quantum_vulnerable
    usable: true
    citation: "docs/sources/India_DST_Quantum_Safe_Roadmap_2026.md -- printed pp. 105-107"
    quote: "Milestone 3: Full Migration – (CII : 31 December 2029, Enterprises: No later than 31 December 2033)"
    milestones:
      - key: foundations
        label: "Building the foundations (inventory, CBOM requests)"
        # Programme-level: inventory, CBOM requests, pilots. Not something a
        # single key meets or misses, so risk/policy.py never lays it on a row.
        scope: programme
        date: 2028-12-31
        quote: "Milestone 1: Building the Foundations - (CII: No later than 31 December 2027, Enterprises: No later than 31 December 2028)"
      - key: high_priority
        label: "High-priority systems migrated"
        date: 2030-12-31
        quote: "Milestone 2: Migration of High-Priority Systems – (CII: 31 December 2028, Enterprises: No later than 31 December 2030)"
      - key: full_migration
        label: "Full migration"
        date: 2033-12-31
        quote: "Milestone 3: Full Migration – (CII : 31 December 2029, Enterprises: No later than 31 December 2033)"

  - key: NIST_IR_8547_IPD
    label: "NIST IR 8547 (initial public draft)"
    applies_to: quantum_vulnerable
    usable: true
    citation: "docs/sources/NIST_IR_8547_ipd.md -- Tables 2 and 4"
    quote: "112 bits of security strength | Deprecated after 2030; Disallowed after 2035"
    milestones:
      - key: deprecated_112
        label: "Deprecated (112-bit strength)"
        date: 2030-12-31
        quote: "112 bits of security strength | Deprecated after 2030"
        # Applies only at the 112-bit level. Strength comes from
        # data/security_strength.yaml (SP 800-57 Table 2, SP 800-186 Table 1);
        # a row whose strength is not known is "undetermined", never assumed.
        applies_at_strength: 112
      - key: disallowed
        label: "Disallowed"
        date: 2035-12-31
        quote: "≥ 128 bits of security strength | Disallowed after 2035"

  - key: EU_HIGH_RISK
    label: "EU coordinated roadmap -- high-risk use cases"
    applies_to: quantum_vulnerable
    usable: true
    citation: "docs/sources/EU_PQC_Coordinated_Roadmap_2025.md -- PDF pp. 6-7"
    quote: "For high-risk use cases, quantum-vulnerable public-key mechanisms shall not be used stand-alone after the end of 2030"
    note: >-
      Risk level is the operator's classification (the roadmap derives it from
      a quantum risk score the organisation computes, p. 10; this tool computes
      no score). Apply this policy to use cases the operator classes high-risk.
    milestones:
      - key: no_standalone_classical
        label: "No stand-alone quantum-vulnerable public key"
        date: 2030-12-31
        quote: "By 31.12.2030: ... The PQC transition for high-risk use cases has been completed."

  - key: EU_MEDIUM_RISK
    label: "EU coordinated roadmap -- medium-risk use cases"
    applies_to: quantum_vulnerable
    usable: true
    citation: "docs/sources/EU_PQC_Coordinated_Roadmap_2025.md -- PDF pp. 6-7"
    quote: "analogously after the end of 2035 for medium-risk use cases"
    milestones:
      - key: no_standalone_classical
        label: "No stand-alone quantum-vulnerable public key"
        date: 2035-12-31
        quote: "By 31.12.2035: • The PQC transition for medium-risk use cases has been completed."

  - key: US_EO14412_HVA
    label: "US EO 14412 -- High Value Assets / high impact federal systems"
    # Key-prefix "US_" is this registry's jurisdiction convention, same as
    # IN_ / EU_ / NIST_ above; no schema field was added for it.
    applies_to: quantum_vulnerable
    usable: true
    citation: "docs/sources/US_EO_14412_2026.md -- Sec. 4(b)"
    quote: "transition all HVAs and high impact systems to use PQC for key establishment by December 31, 2030"
    note: >-
      Executive Order 14412, "Securing the Nation Against Advanced
      Cryptographic Attacks" (signed 2026-06-22). Excludes National Security
      Systems (Sec. 4(b) preamble). Implemented for agencies by OMB M-26-15,
      2026-06-24 (docs/sources/US_OMB_M-26-15_2026.md), which restates the
      same two dates as its migration-plan Phase 3 (key establishment,
      2028-2030) and Phase 4 (signatures, 2031), and requires the automated
      cryptographic inventory to populate a CBOM -- no separate dated CBOM
      milestone is stated in either document, so none is added here.
    milestones:
      - key: key_establishment
        label: "PQC for key establishment"
        date: 2030-12-31
        quote: "transition all HVAs and high impact systems to use PQC for key establishment by December 31, 2030"
      - key: digital_signatures
        label: "PQC for digital signatures"
        date: 2031-12-31
        quote: "transition all HVAs and high impact systems to use PQC for digital signatures by December 31, 2031"

  - key: CA_CCCS_ITSM40001
    label: "Canada CCCS ITSM.40.001 -- Roadmap for the migration to post-quantum cryptography for the Government of Canada"
    # Key-prefix "CA_" is this registry's jurisdiction convention, same as
    # US_ / IN_ / EU_ / NIST_ above; no schema field was added for it.
    applies_to: quantum_vulnerable
    usable: true
    citation: "docs/sources/CA_CCCS_ITSM40001_2025.md"
    quote: "End of 2035: Completion of PQC migration of remaining systems"
    note: >-
      CCCS guidance to Government of Canada departments (ITSM.40.001, dated
      modified 2025-06-24 per the fetched page). No National Security Systems
      carve-out was found in the source (unlike EO 14412 above); this row
      applies to the roadmap as published, without inferring a scope
      exclusion the source does not state.
    milestones:
      - key: initial_departmental_plan
        label: "Initial departmental PQC migration plan"
        # Programme-level: a single agency-wide plan, not something a per-key
        # ledger row meets or misses, so risk/policy.py never lays it on a row.
        scope: programme
        date: 2026-04-30
        quote: "April 2026: Develop an initial departmental PQC migration plan"
      - key: annual_progress_reporting
        label: "Annual PQC migration progress reporting begins"
        scope: programme
        date: 2026-04-30
        quote: "Beginning April 2026 and annually after: Report on PQC migration progress"
      - key: high_priority
        label: "High-priority systems migrated"
        date: 2031-12-31
        quote: "End of 2031: Completion of PQC migration of high priority systems"
      - key: full_migration
        label: "Full migration (remaining systems)"
        date: 2035-12-31
        quote: "End of 2035: Completion of PQC migration of remaining systems"

  - key: DE_BSI_TR02102_KEY_AGREEMENT
    label: "Germany BSI TR-02102-1 -- classical-only key agreement"
    applies_to: quantum_vulnerable
    usable: true
    citation: "docs/sources/DE_BSI_TR-02102-1_2026.md -- Section 2.1 / 2.3"
    quote: "The sole use of classic key agreement mechanisms is only recommended until the end of 2031"
    note: >-
      BSI TR-02102-1, "Cryptographic Mechanisms: Recommendations and Key
      Lengths", Version 2026-01 (as of 23 January 2026). Recommends hybrid
      key agreement combining a classical mechanism with FrodoKEM, Classic
      McEliece, or ML-KEM (Section 2.4) beyond this date. Applies to key
      agreement / encryption only; the signature cutoff is the separate
      DE_BSI_TR02102_SIGNATURES row below.
    milestones:
      - key: no_classical_only_key_agreement
        label: "No sole use of classical key agreement"
        date: 2031-12-31
        quote: "The sole use of classic key agreement mechanisms is only recommended until the end of 2031, see also Section 2.3."

  - key: DE_BSI_TR02102_SIGNATURES
    label: "Germany BSI TR-02102-1 -- classical-only signatures"
    applies_to: quantum_vulnerable
    usable: true
    citation: "docs/sources/DE_BSI_TR-02102-1_2026.md -- Section 2.1"
    quote: "the use of classic signature mechanisms is therefore only recommended until the end of 2035"
    note: >-
      Same Technical Guideline as DE_BSI_TR02102_KEY_AGREEMENT above; follows
      the EU coordinated roadmap's 2035 signature transition date (Section
      2.1, citing [1]).
    milestones:
      - key: no_classical_only_signatures
        label: "No sole use of classical signatures"
        date: 2035-12-31
        quote: "Based on current knowledge, the use of classic signature mechanisms is therefore only recommended until the end of 2035."

  - key: IN_SEBI_CSCRF
    label: "India SEBI CSCRF -- PQC crypto-agility (no dated milestone)"
    applies_to: quantum_vulnerable
    usable: false
    citation: "docs/sources/IN_SEBI_CSCRF_2024.md"
    quote: "REs shall enhance their crypto-agility to ensure a seamless transition to quantum-resistant solutions without disrupting their current IT systems."
    why_not_usable: >-
      SEBI circular SEBI/HO/ITD-1/ITD_CSC_EXT/P/CIR/2024/113 (20 Aug 2024),
      "Cybersecurity and Cyber Resilience Framework (CSCRF) for SEBI
      Regulated Entities", Box Item 7 (p.59-60), requires REs to maintain a
      cryptographic-asset inventory prioritised for PQC migration and to
      "enhance their crypto-agility" -- but states these as "indicative
      measures" with no calendar date. The circular's compliance-timeline
      section (Table 15) sets periodicities for the general risk-assessment
      standard PQC risk is folded into (half-yearly for MIIs, annual for
      Qualified/Mid-size REs), not a PQC-specific deadline. Two later
      clarification circulars (2024/184, 31 Dec 2024; 2025/119, 28 Aug 2025)
      were checked and contain no quantum/PQC content. No milestone date is
      recorded here rather than inventing one; see docs/sources/ for the
      full quote and search notes.
    milestones: []
  - key: IN_RBI_CYBERSEC_MD
    label: "India RBI Cybersecurity, Technology: Risk, Resilience and Assurance Framework Directions, 2026 (commercial banks) -- crypto-agility (no dated PQC milestone)"
    applies_to: quantum_vulnerable
    usable: false
    citation: "docs/sources/IN_RBI_Cybersecurity_TRRA_MD_2026.md"
    quote: "The key length, algorithms, cipher suites and applicable protocols used in transmission channels, processing of data and authentication purpose shall be strong."
    why_not_usable: >-
      RBI/DoS/2026-27/410 (issued 31 July 2026, effective immediately) requires
      "strong" key length/algorithms/cipher suites and adoption of standards "not
      deprecated / demonstrated to be insecure / vulnerable" (para 140), but states no
      quantum, post-quantum, PQC, or cryptographic-migration date anywhere in the
      fetched text. This is a standing, undated obligation from the effective date, not
      a future compliance milestone the Milestone schema's required `date` field can
      represent without guessing one. See docs/sources/ for the fetch limitation (no
      independently vendored PDF/SHA-256 for this HTML-viewed Master Direction).
    milestones: []

  - key: IN_RBI_QSAFE
    label: "India RBI Q-SAFE Expert Committee -- financial-sector CBOM & crypto-agility review (no dated milestone)"
    applies_to: quantum_vulnerable
    usable: false
    citation: "docs/sources/IN_RBI_QSAFE_Committee_2026.md"
    quote: "The Committee will submit its report within six months from the date of its first meeting."
    why_not_usable: >-
      RBI Press Release 2026-2027/325 (25 May 2026) constitutes an Expert Committee
      (convened by Prof. Anil Prabhakar, IIT Madras) to evaluate the financial sector's
      cryptographic inventory via a CBOM and recommend a PQC roadmap for the financial
      system. Its own reporting deadline is relative ("six months from the date of its
      first meeting") and that first-meeting date is not stated in the press release or
      found elsewhere, so no calendar date can be derived without guessing. Recorded as
      an undated BFSI obligation in data/sector_profiles.yaml instead.
    milestones: []

  - key: IN_TEC_PQC
    label: "India TEC 910018:2025 -- PQC migration technical report, telecom sector (informational, no mandate date)"
    applies_to: quantum_vulnerable
    usable: false
    citation: "docs/sources/IN_TEC_PQC_Migration_Report_2025.md"
    quote: "Telecom Sector - To secure OSS (operation support system) and BSS (Business support system) applications"
    why_not_usable: >-
      TEC 910018:2025 (Telecommunication Engineering Centre, DoT, Release 1.0, January
      2025) is a technical/advisory report "based on the consensus built upon the
      contributions of the member[s]" of a TEC committee, not a DoT circular or
      regulatory mandate. It contains PQC migration guidance and telecom use cases
      (Annexure-I) but no compliance date, mandate language, or deadline binding
      operators or equipment vendors. A search for a separate DoT mandate requiring PQC
      readiness for new telecom equipment from 2026 found none (see the source file for
      what was checked). Recorded as an undated telecom obligation reference in
      data/sector_profiles.yaml instead.
    milestones: []
