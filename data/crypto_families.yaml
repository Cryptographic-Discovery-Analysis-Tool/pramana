# Which key-establishment / key-transport families the confidentiality ledger
# applies to (Pramana_Ledger_Spec.md §5.5: "Applies only to Shor-broken
# confidentiality functions"; band rule "not Shor-broken, or HYBRID_KEX from
# start -> SAFE").
#
# Same rule as data/base_confidence.yaml: a row is `usable: true` ONLY when
# `citation` points at a non-empty in-repo source that states the literal
# classification, and `quote` reproduces it. No row is added from memory, and
# no family is classified by pattern-matching its name.
#
# The citable in-repo source is the frozen deterministic test set
# (Pramana_Ledger_Spec.md §6), which states each family's ledger treatment
# directly: an expected band IS the classification.
schema_version: 1

families:
  - key: RSA
    shor_broken: true
    usable: true
    citation: "docs/architecture/Pramana_Ledger_Spec.md §6, row 2"
    quote: "RSA static key transport, X=7y, since 2021-01-01 | central: SAVABLE, deadline 2029-01-01"
    note: >-
      The row is in the confidentiality ledger at all, and its deadline is
      Z - X, which is the Shor-broken treatment. RSA's signature use is on the
      authentication clock instead (§6 row 1).

  - key: X25519
    shor_broken: true
    usable: true
    citation: "docs/architecture/Pramana_Ledger_Spec.md §6, row 3"
    quote: "X25519 ECDHE, X=25y, since 2021-01-01 | all Z: BLEEDING, unsavable [2021-01-01, as_of]"

  - key: P-256
    shor_broken: true
    usable: true
    citation: "docs/architecture/Pramana_Ledger_Spec.md §6, row 4"
    quote: "P-256 ECDHE, X=1y | central: SAVABLE (deadline 2035)"

  - key: P-224
    shor_broken: true
    usable: true
    citation: "docs/sources/NIST_IR_8547_ipd.md -- Tables 2 and 4 (ECDSA; Elliptic Curve DH)"
    quote: "ECDSA [FIPS186] | 112 bits of security strength | Deprecated after 2030; Disallowed after 2035"

  - key: P-384
    shor_broken: true
    usable: true
    citation: "docs/sources/NIST_IR_8547_ipd.md -- Tables 2 and 4 (ECDSA; Elliptic Curve DH)"
    quote: "ECDSA [FIPS186] | ≥ 128 bits of security strength | Disallowed after 2035"

  - key: P-521
    shor_broken: true
    usable: true
    citation: "docs/sources/NIST_IR_8547_ipd.md -- Tables 2 and 4 (ECDSA; Elliptic Curve DH)"
    quote: "ECDSA [FIPS186] | ≥ 128 bits of security strength | Disallowed after 2035"

  - key: X448
    shor_broken: true
    usable: true
    citation: "docs/sources/NIST_IR_8547_ipd.md -- Table 4 (Elliptic Curve DH)"
    quote: "Elliptic Curve DH and MQC [SP80056A] | ≥ 128 bits of security strength | Disallowed after 2035"

  - key: Ed25519
    shor_broken: true
    usable: true
    citation: "docs/sources/NIST_IR_8547_ipd.md -- Table 2 (EdDSA)"
    quote: "EdDSA [FIPS186] | ≥ 128 bits of security strength | Disallowed after 2035"

  - key: ML-KEM
    shor_broken: false
    usable: true
    citation: "docs/architecture/Pramana_Ledger_Spec.md §3, row 'Recommendation'"
    quote: "purpose-keyed option sets (FIPS 203/204/205, hybrid X25519MLKEM768)"
    note: >-
      Named as the PQC option set, i.e. the thing migration moves TO. §5.5's
      "not Shor-broken ... -> SAFE" is the corresponding band.

  - key: DH
    shor_broken: true
    usable: true
    citation: "docs/sources/NIST_IR_8547_ipd.md -- Table 4, quantum-vulnerable key-establishment schemes"
    quote: "Finite Field DH and MQV [SP80056A] | 112 bits of security strength | Deprecated after 2030; Disallowed after 2035"
    note: >-
      Resolved 2026-09-23. Was usable:false pending exactly this citation
      ("TODO-VERIFY: cite NIST IR 8547 once it is vendored into docs/").
      Table 4 lists finite-field DH as quantum-vulnerable at every strength.

  - key: ECDH
    shor_broken: true
    usable: true
    citation: "docs/architecture/ECDAT_Final_Architecture.md -- Step 1 quantum vulnerability tier table"
    quote: "Broken by Shor | RSA, ECDSA, ECDH, DH, DSA | Replace — no parameter increase helps"
    note: >-
      Added 2026-09-28 (DEV-019 follow-up / quickscan demo): a JCA call site
      naming the generic algorithm "ECDH" (e.g. `KeyAgreement.getInstance
      ("ECDH")`, Java Security Standard Algorithm Names doc; see
      docs/sources/Oracle_JavaSE17_Cipher_Transformation.md) names no curve,
      so it cannot resolve to a curve-specific family (P-256, P-384, ...) --
      it is its own family, generically Shor-broken per the architecture's
      own tier table (cross-checked by NIST_IR_8547_ipd.md Table 4's
      "Elliptic Curve DH and MQC [SP80056A]" row, same classification).

  - key: DSA
    shor_broken: true
    usable: true
    citation: "docs/architecture/ECDAT_Final_Architecture.md -- Step 1 quantum vulnerability tier table"
    quote: "Broken by Shor | RSA, ECDSA, ECDH, DH, DSA | Replace — no parameter increase helps"
    note: >-
      Added 2026-09-28. `adapters/certs/parser.py::_public_key_description`
      reports a DSA public key's algorithm_family as the literal "DSA",
      which is this row's exact key -- no alias needed.

  - key: AES
    shor_broken: false
    usable: true
    citation: "docs/architecture/ECDAT_Final_Architecture.md -- Step 1 quantum vulnerability tier table"
    quote: >-
      "Weakened by Grover | AES-128, SHA-1, smaller hashes | Increase size —
      Grover is quadratic, not exponential" and "Not quantum-affected |
      AES-256, SHA-384/512 | No action"
    note: >-
      Added 2026-09-28 (DEV-019 follow-up / quickscan demo): AES is
      symmetric, so it is never Shor-broken at any key size -- both rows
      that mention it (AES-128 under Grover, AES-256 as unaffected) agree on
      that, they differ only on whether Grover's quadratic speedup motivates
      a larger key, which the ledger's `shor_broken` field does not encode.
      `shor_broken: false` here means exactly "not broken by Shor", not "no
      migration consideration at all" -- Grover-driven key-size guidance is
      a separate policy question, out of this field's scope (Pramana_Ledger_
      Spec.md §5.5: "Grover cases go to policy flags, not the ledger").
      A specific size (AES-128 vs AES-256) is not distinguished here because
      `adapters/source/semgrep.py`'s `algorithm` field for a Cipher call
      site is the transformation string (e.g. "AES/GCM/NoPadding"), which
      never states a key size -- only the key material would, and this
      registry never reads key material.

# Groups negotiated on the wire that are hybrid key establishment.
#
# `codepoint` and `deprecated` are cited separately from `citation`/`quote`
# (which classify the group as HYBRID_KEX per Pramana_Ledger_Spec.md §5.1):
# they come from docs/sources/IANA_TLS_SupportedGroups_2026.md, the IANA TLS
# Supported Groups registry, added 2026-09-26 for OI-016/OI-017's resolution
# (DEV-013: individual per-group probing). A row with `deprecated: true` is
# still `usable: true` for HYBRID_KEX classification (it IS a hybrid key
# exchange, negotiated on the wire, same as any other) -- `deprecated` only
# tells the adapter to attach a visibility note, never to withhold the
# classification itself.
hybrid_groups:
  - key: X25519MLKEM768
    usable: true
    citation: "docs/architecture/Pramana_Ledger_Spec.md §5.1"
    quote: "negotiated `X25519MLKEM768` -> HYBRID_KEX (Observed)"
    codepoint: "0x11EC"
    codepoint_citation: "docs/sources/IANA_TLS_SupportedGroups_2026.md -- Rows table, value 4588"
    codepoint_quote: "4588 (`0x11EC`) | X25519MLKEM768 | Y | Y | [RFC 10024]"
    deprecated: false

  - key: SecP256r1MLKEM768
    usable: true
    citation: "docs/sources/IETF_RFC_10024_2026.md -- Abstract"
    quote: "This document defines three hybrid key agreement mechanisms for TLS 1.3 -- X25519MLKEM768, SecP256r1MLKEM768, and SecP384r1MLKEM1024"
    note: >-
      Resolved 2026-09-26 by RFC 10024. Previously recorded below as
      "searched for and NOT found in any in-repo document" -- adding it by
      analogy with X25519MLKEM768 would have been exactly the interpolation
      data/base_confidence.yaml forbids, so it waited for a citable source.
    codepoint: "0x11EB"
    codepoint_citation: "docs/sources/IANA_TLS_SupportedGroups_2026.md -- Rows table, value 4587"
    codepoint_quote: "4587 (`0x11EB`) | SecP256r1MLKEM768 | Y | N | [RFC 10024]"
    deprecated: false

  - key: SecP384r1MLKEM1024
    usable: true
    citation: "docs/sources/IETF_RFC_10024_2026.md -- Abstract"
    quote: "This document defines three hybrid key agreement mechanisms for TLS 1.3 -- X25519MLKEM768, SecP256r1MLKEM768, and SecP384r1MLKEM1024"
    note: >-
      Resolved 2026-09-26 by RFC 10024. Same note as SecP256r1MLKEM768 above.
    codepoint: "0x11ED"
    codepoint_citation: "docs/sources/IANA_TLS_SupportedGroups_2026.md -- Rows table, value 4589"
    codepoint_quote: "4589 (`0x11ED`) | SecP384r1MLKEM1024 | Y | N | [RFC 10024]"
    deprecated: false

  - key: X25519Kyber768Draft00
    usable: true
    citation: "docs/architecture/Pramana_Ledger_Spec.md §5.1"
    quote: "negotiated `X25519MLKEM768` -> HYBRID_KEX (Observed)"
    note: >-
      Same rule as X25519MLKEM768 above -- §5.1 classifies ANY negotiated
      hybrid group as HYBRID_KEX (Observed); it names X25519MLKEM768 as the
      example, not as an exclusive list. This is still a real hybrid
      (ECDH + Kyber768) key exchange when observed on the wire, so it is not
      withheld from `hybrid_groups()` -- only flagged `deprecated` so the
      adapter can say, in words, that it predates standardisation and was
      obsoleted. Added 2026-09-26 for OI-016/OI-017 (DEV-013): a legacy
      endpoint that still negotiates this draft group is migration evidence
      of a DIFFERENT, worse kind than one negotiating a standardised group,
      and the ledger should not conflate the two silently.
    codepoint: "0x6399"
    codepoint_citation: "docs/sources/IANA_TLS_SupportedGroups_2026.md -- Rows table, value 25497"
    codepoint_quote: "25497 (`0x6399`) | X25519Kyber768Draft00 (OBSOLETE) | Y | D | [draft-tls-westerbaan-xyber768d00-02][RFC 10024] -- \"Pre-standards version of Kyber768. Obsoleted by [RFC 10024].\""
    deprecated: true
    deprecated_citation: "docs/sources/IANA_TLS_SupportedGroups_2026.md -- Rows table, value 25497"
    deprecated_quote: "Pre-standards version of Kyber768. Obsoleted by [RFC 10024]."

# Registry spellings of the SAME curve. These are naming identities, not risk
# claims: they assert only that two strings name one object, which is why they
# carry `basis: NAMING_IDENTITY` and are kept apart from the `families` rows
# above. An unlisted spelling stays unresolved and produces a closure task.
family_aliases:
  - key: secp256r1
    family: P-256
    usable: true
    basis: NAMING_IDENTITY
    citation: "docs/architecture/Pramana_Ledger_Spec.md §6, row 4 ('P-256 ECDHE')"
    quote: "P-256 ECDHE, X=1y"
    note: >-
      sslyze and OpenSSL report this curve as `secp256r1` / `prime256v1`; the
      frozen test set names it `P-256`. Same curve, three spellings.
  - key: prime256v1
    family: P-256
    usable: true
    basis: NAMING_IDENTITY
    citation: "docs/architecture/Pramana_Ledger_Spec.md §6, row 4 ('P-256 ECDHE')"
    quote: "P-256 ECDHE, X=1y"

  - key: secp384r1
    family: P-384
    usable: true
    basis: NAMING_IDENTITY
    citation: "docs/sources/IETF_RFC_5480_2009.md -- §2.1.1.1, correspondence note"
    quote: >-
      "Note that [FIPS186-3] refers to secp192r1 as P-192, secp224r1 as
      P-224, secp256r1 as P-256, secp384r1 as P-384, and secp521r1 as P-521."
    note: >-
      Added 2026-09-28: DEV-019 recorded secp384r1/P-384 as "no alias row
      yet" (unclassified, honestly, not silently 0) pending exactly this
      citation. `cryptography`/OpenSSL report this curve as `secp384r1`; the
      ledger-cited family row (data/crypto_families.yaml `P-384`, itself
      cited to docs/sources/NIST_IR_8547_ipd.md Tables 2/4) is spelled
      `P-384`. Same curve, two spellings.

  - key: secp521r1
    family: P-521
    usable: true
    basis: NAMING_IDENTITY
    citation: "docs/sources/IETF_RFC_5480_2009.md -- §2.1.1.1, correspondence note"
    quote: >-
      "Note that [FIPS186-3] refers to secp192r1 as P-192, secp224r1 as
      P-224, secp256r1 as P-256, secp384r1 as P-384, and secp521r1 as P-521."
    note: >-
      Added 2026-09-28, same reasoning as secp384r1 above, for the P-521 row.

  - key: rsaEncryption
    family: RSA
    usable: true
    basis: NAMING_IDENTITY
    citation: "docs/sources/IETF_RFC_8017_2016.md -- Appendix A.1, RSA Key Representation"
    quote: "rsaEncryption OBJECT IDENTIFIER ::= { pkcs-1 1 }"
    note: >-
      Added 2026-09-28: some tooling (and a raw X.509
      SubjectPublicKeyInfo/PKCS#12 algorithm OID printed without translation)
      reports an RSA public key's algorithm as the ASN.1 OID name
      `rsaEncryption` rather than the plain string `RSA` that
      `adapters/certs/parser.py::_public_key_description` itself emits for a
      `cryptography`-parsed key. This alias covers that spelling wherever it
      reaches the family classifier directly (e.g. a future adapter that
      reads the OID name off the wire/ASN.1 without going through
      `cryptography`'s typed key objects).

